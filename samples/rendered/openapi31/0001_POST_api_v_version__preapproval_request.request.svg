  <text x="138" y="42" font-family="Consolas, 'Liberation Mono', monospace" font-size="20" fill="#283443" xml:space="preserve" font-weight="bold">/api/v{version}/preapproval/request</text>
  <text x="22" y="85" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#344150" xml:space="preserve" font-weight="bold">BTC / CashExpress preapproval request intake</text>
  <text x="22" y="131" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#344150" xml:space="preserve" font-weight="bold">Request</text>
  <text x="22" y="162" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#344150" xml:space="preserve">Metoda zaprima zahtjev za predodobrenje i vraća poruku o rezultatu validacije. Podržava slova č, ć, đ, š i ž te znakove &lt;, &gt; i &amp;.</text>
